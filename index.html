<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2a78d6" />
  <meta name="description" content="Track single-leg calf raise hold times and watch your progress" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.svg" />
  <link rel="apple-touch-icon" href="icon-192.svg" />
  <link rel="stylesheet" href="style.css" />
  <title>Calf Raise Hold Tracker</title>
</head>
<body>
  <header class="app-header">
    <h1>Calf Raise Holds</h1>
  </header>

  <main>
    <!-- LOG VIEW -->
    <section id="view-log" class="view">
      <div class="today-summary" id="today-summary"></div>

      <div class="last-saved" id="last-saved" hidden></div>

      <h2 class="section-heading">Today's sessions</h2>
      <div id="today-sessions"></div>
    </section>

    <!-- PROGRESS VIEW -->
    <section id="view-progress" class="view" hidden>
      <h2 class="section-heading">Progress</h2>
      <div class="chart-card" id="chart-card"></div>

      <h2 class="section-heading">History</h2>
      <div id="history-days"></div>

      <button class="btn-danger" id="btn-clear" type="button">Clear all data</button>
    </section>
  </main>

  <nav class="tab-bar">
    <button class="tab-btn is-active" data-view="log" type="button">
      <span>Log</span>
    </button>
    <button class="tab-btn" data-view="progress" type="button">
      <span>Progress</span>
    </button>
  </nav>

  <!-- MANUAL ENTRY OVERLAY -->
  <div class="entry-overlay" id="entry-overlay" hidden>
    <div class="entry-overlay__leg" id="entry-leg-label"></div>

    <div class="entry-overlay__input-row">
      <input
        class="entry-overlay__input"
        id="entry-input"
        type="number"
        inputmode="decimal"
        step="0.1"
        min="0"
        placeholder="0.0"
        autocomplete="off"
      />
      <span class="entry-overlay__unit">s</span>
    </div>

    <div class="stopwatch-row">
      <span class="stopwatch-row__time" id="stopwatch-display">0.0s</span>
      <button class="stopwatch-btn" id="btn-stopwatch-toggle" type="button">Start timer</button>
      <button class="stopwatch-btn stopwatch-btn--ghost" id="btn-stopwatch-reset" type="button">Reset</button>
    </div>

    <div class="entry-overlay__actions">
      <button class="entry-overlay__save" id="btn-save" type="button">Save</button>
      <button class="entry-overlay__cancel" id="btn-entry-cancel" type="button">Cancel</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
